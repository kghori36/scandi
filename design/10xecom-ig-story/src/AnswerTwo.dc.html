<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /*FONTS*/
/*BASE*/
    .head { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif;
      font-size: 128px; line-height: 0.88; letter-spacing: -0.035em; margin: 0; color: #F2F2EF; }
    .head span { display: block; }
    .head em { font-style: normal; color: #C6FF3D; }
  </style>
</helmet>
<div class="story">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="inner">

    <div class="topbar">
      <div class="tag"><span class="dot"></span><span>Answer 02</span></div>
      <div class="topright">Last one</div>
    </div>

    <div>
      <h1 class="head">
        <span>It's not</span>
        <span>traffic.</span>
        <span>It's <em>math.</em></span>
      </h1>
      <p class="say">AOV, CAC, LTV. Fix those three and traffic stops being the problem.</p>
      <p class="guess">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C6FF3D" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
          <path d="M5 12h13"></path>
          <path d="M12 6l6 6-6 6"></path>
        </svg>
        <span>Turn on notifications.</span>
      </p>
    </div>

    <div class="cta">
      <div class="pill"><span>Follow me + stay tuned</span></div>
      <div class="foot"><span class="bar"></span><span>The reveal is next</span></div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
