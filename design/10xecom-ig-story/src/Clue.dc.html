<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /*FONTS*/
/*BASE*/
    .acr { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif;
      font-size: 176px; line-height: 0.86; letter-spacing: -0.02em; margin: 0; color: #C6FF3D; }
    .acr span { display: block; }
  </style>
</helmet>
<div class="story">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="inner">

    <div class="topbar">
      <div class="tag"><span class="dot"></span><span>02 / 03</span></div>
      <div class="topright">Still not telling</div>
    </div>

    <div>
      <h1 class="acr"><span>AOV</span><span>CAC</span><span>LTV</span></h1>
      <p class="say">If those three mean something to you, you're already closer than most.</p>
      <p class="guess">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C6FF3D" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
          <path d="M5 12h13"></path>
          <path d="M12 6l6 6-6 6"></path>
        </svg>
        <span>DM me your guess.</span>
      </p>
    </div>

    <div class="cta">
      <div class="pill"><span>Follow me + stay tuned</span></div>
      <div class="foot"><span class="bar"></span><span>One more clue to go</span></div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
