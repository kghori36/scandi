<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /*FONTS*/
/*BASE*/
    .head { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif;
      font-size: 156px; line-height: 0.86; letter-spacing: -0.03em; margin: 0; color: #F2F2EF; }
    .head span { display: block; }
    .redacted { display: flex; gap: 26px; margin-top: 62px; }
    .redacted i { display: block; height: 112px; background: #C6FF3D; }
    .r1 { width: 296px; }
    .r2 { width: 468px; }

  </style>
</helmet>
<div class="story">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="inner">

    <div class="topbar">
      <div class="tag"><span class="dot"></span><span>01 / 03</span></div>
      <div class="topright">Coming soon</div>
    </div>

    <div>
      <h1 class="head">
        <span>I've been</span>
        <span>building</span>
      </h1>
      <div class="redacted"><i class="r1"></i><i class="r2"></i></div>
      <p class="say">I'm not telling you what it is yet.</p>
      <p class="guess">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C6FF3D" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
          <path d="M5 12h13"></path>
          <path d="M12 6l6 6-6 6"></path>
        </svg>
        <span>Reply with your best guess.</span>
      </p>
    </div>

    <div class="cta">
      <div class="pill">
        <span>Follow me + stay tuned</span>
      </div>
      <div class="foot"><span class="bar"></span><span>First look drops here</span></div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
