<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /*FONTS*/
/*BASE*/
    .head { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif;
      font-size: 120px; line-height: 0.88; letter-spacing: -0.035em; margin: 0; color: #F2F2EF; }
    .head span { display: block; }
    .built { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif;
      font-size: 52px; line-height: 1.1; letter-spacing: -0.02em; color: #F2F2EF; margin: 56px 0 0; }
    .rb { display: inline-block; width: 286px; height: 40px;
      background: #C6FF3D; margin-left: 20px; vertical-align: -0.02em; }
  </style>
</helmet>
<div class="story">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="inner">

    <div class="topbar">
      <div class="tag"><span class="dot"></span><span>01 / 03</span></div>
      <div class="topright">Coming soon</div>
    </div>

    <div>
      <h1 class="head">
        <span>Still up</span>
        <span>after your</span>
        <span>shift?</span>
      </h1>
      <p class="built">I've been building<i class="rb"></i></p>
      <p class="say">Not for people with money and free time. For people with neither. I'm not telling you what it is yet.</p>
      <p class="guess">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#C6FF3D" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
          <path d="M5 12h13"></path>
          <path d="M12 6l6 6-6 6"></path>
        </svg>
        <span>Reply if that's you.</span>
      </p>
    </div>

    <div class="cta">
      <div class="pill"><span>Follow me + stay tuned</span></div>
      <div class="foot"><span class="bar"></span><span>First look drops here</span></div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
