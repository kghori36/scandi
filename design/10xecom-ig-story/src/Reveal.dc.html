<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    /*FONTS*/
/*BASE*/
    .callback { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif;
      font-size: 54px; line-height: 1; letter-spacing: -0.02em; color: #F2F2EF; margin: 0 0 26px; }
    .mark { font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif;
      font-size: 288px; line-height: 0.83; letter-spacing: -0.035em; margin: 0; }
    .mark .l1 { display: block; color: #C6FF3D; }
    .mark .l2 { display: block; color: #F2F2EF; }
    .rule { height: 3px; background: #C6FF3D; width: 168px; margin: 54px 0 40px; }
    .what { font-size: 35px; line-height: 1.5; color: #B7B7BF; margin: 0; max-width: 850px; text-wrap: pretty; }
    .what b { color: #F2F2EF; font-weight: 700; }

    .dm { display: flex; align-items: center; gap: 20px;
      background: #C6FF3D; color: #0B0B0F; padding: 30px 42px;
      font-size: 36px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .kw { background: #0B0B0F; color: #C6FF3D; padding: 10px 20px; letter-spacing: 0.08em; }
  </style>
</helmet>
<div class="story">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="inner">

    <div class="topbar">
      <div class="tag"><span class="dot"></span><span>It's live</span></div>
      <div class="topright">No more redactions</div>
    </div>

    <div>
      <p class="callback">So — I've been building</p>
      <h1 class="mark"><span class="l1">10X</span><span class="l2">ECOM</span></h1>
      <div class="rule"></div>
      <p class="what">A cohort for ecommerce operators. We fix the math — <b>offer, acquisition, retention, margin</b> — so growth stops depending on more traffic.</p>
    </div>

    <div class="cta">
      <div class="dm">
        <span>DM me</span>
        <span class="kw">10X</span>
        <span>for the details</span>
      </div>
      <div class="foot"><span class="bar"></span><span>Cohort 01 — I'll tell you if it's a fit</span></div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
